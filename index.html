<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlayMarket — Покупатель</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MQTT для реальной синхронизации через интернет -->
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .toast-enter { transform: translateY(100%); opacity: 0; }
    .toast-show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 md:pb-10">

  <div class="max-w-7xl mx-auto p-3 sm:p-6 space-y-5">
    
    <!-- Шапка, Баланс и Комната -->
    <header class="bg-slate-900/90 backdrop-blur-md p-4 rounded-3xl border border-slate-800 flex flex-wrap justify-between items-center gap-3 shadow-2xl sticky top-2 z-40">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 sm:w-12 sm:h-12 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center text-xl sm:text-2xl shadow-inner">
          🛍️
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-black text-white tracking-tight">PlayMarket <span class="text-amber-400">Buyer</span></h1>
          <div class="flex items-center gap-1.5 text-[11px] text-slate-400 font-bold">
            <span>🌐 Комната:</span>
            <input type="text" id="room-input" value="market71" onchange="changeRoom()" class="bg-slate-950 border border-slate-800 text-amber-400 font-black px-2 py-0.5 rounded-lg w-24 text-center outline-none focus:border-amber-400">
            <span id="sync-status" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" title="Подключение..."></span>
          </div>
        </div>
      </div>

      <!-- Баланс -->
      <div class="flex items-center gap-2 sm:gap-3 bg-slate-950/80 p-2 rounded-2xl border border-slate-800/80 w-full sm:w-auto justify-between sm:justify-start">
        <div class="px-2 text-left sm:text-right">
          <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Баланс</p>
          <p class="text-base sm:text-lg font-black text-emerald-400 leading-none"><span id="balance">0</span> $</p>
        </div>
        <div class="flex items-center gap-1.5">
          <input type="number" id="topup-input" placeholder="Сумма" class="w-20 p-2 bg-slate-900 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none focus:border-amber-400">
          <button onclick="topUp()" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black px-3 py-2 rounded-xl text-xs shadow-md shadow-amber-400/20 transition">
            + Пополнить
          </button>
        </div>
      </div>
    </header>

    <!-- Переключатель Вкладок (Навигация) -->
    <nav class="flex bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800 shadow-xl gap-1">
      <button onclick="switchTab('catalog')" id="tab-btn-catalog" class="flex-1 py-3 px-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition bg-amber-400 text-slate-950 shadow-md shadow-amber-400/20">
        <span>🛒</span> <span>Каталог</span>
      </button>
      <button onclick="switchTab('cart')" id="tab-btn-cart" class="flex-1 py-3 px-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition text-slate-400 hover:text-white">
        <span>🛍️</span> <span>Корзина</span>
        <span id="cart-badge" class="bg-amber-400 text-slate-950 text-[10px] px-1.5 py-0.2 rounded-full font-black">0</span>
      </button>
      <button onclick="switchTab('orders')" id="tab-btn-orders" class="flex-1 py-3 px-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition text-slate-400 hover:text-white">
        <span>📦</span> <span>Заказы</span>
        <span id="orders-badge" class="bg-slate-800 text-amber-400 text-[10px] px-1.5 py-0.2 rounded-full font-black">0</span>
      </button>
    </nav>

    <!-- ================= ВКЛАДКА 1: КАТАЛОГ ================= -->
    <main id="tab-catalog" class="space-y-4">
      <div class="relative">
        <input type="text" id="search-input" oninput="renderCatalog()" placeholder="Поиск среди 300+ предметов..." class="w-full p-3.5 pl-11 bg-slate-900 border border-slate-800 rounded-2xl text-sm font-medium text-white placeholder-slate-500 outline-none focus:border-amber-400 transition shadow-lg">
        <span class="absolute left-4 top-3.5 text-slate-500 text-base">🔍</span>
      </div>

      <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    </main>

    <!-- ================= ВКЛАДКА 2: КОРЗИНА ================= -->
    <main id="tab-cart" class="hidden space-y-4">
      <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-4 max-w-2xl mx-auto">
        <h2 class="text-lg font-black text-amber-400 flex items-center gap-2 border-b border-slate-800 pb-3">
          🛍️ Ваша Корзина
        </h2>

        <div id="cart-items-list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1"></div>

        <div class="pt-3 border-t border-slate-800 flex justify-between items-center font-bold text-lg">
          <span class="text-slate-400">Итого к оплате:</span>
          <span id="cart-total-price" class="text-2xl font-black text-emerald-400">0 $</span>
        </div>

        <button onclick="checkout()" class="w-full bg-amber-400 hover:bg-amber-300 active:scale-98 text-slate-950 font-black py-4 rounded-2xl shadow-lg shadow-amber-400/20 text-base transition">
          Оформить заказ
        </button>
      </div>
    </main>

    <!-- ================= ВКЛАДКА 3: МОИ ЗАКАЗЫ ================= -->
    <main id="tab-orders" class="hidden space-y-4">
      <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <h2 class="text-lg font-black text-slate-200 flex items-center gap-2 border-b border-slate-800 pb-3">
          📦 Мои Заказы (Показать продавцу)
        </h2>
        <div id="buyer-orders-list" class="space-y-4"></div>
      </div>
    </main>

  </div>

  <!-- Красивый Тост-уведомление вместо alert -->
  <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 pointer-events-none toast-enter w-11/12 max-w-md">
    <div id="toast-body" class="bg-slate-900 border border-amber-400/50 text-white p-4 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md">
      <span id="toast-icon" class="text-xl">🔔</span>
      <p id="toast-msg" class="text-xs sm:text-sm font-bold leading-tight"></p>
    </div>
  </div>

  <script>
    // 1. Генерация 320 товаров с реальными картинками
    const CATEGORIES = [
      { name: 'Смартфон', img: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&auto=format&fit=crop&q=80' },
      { name: 'Ноутбук', img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400&auto=format&fit=crop&q=80' },
      { name: 'Наушники', img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&auto=format&fit=crop&q=80' },
      { name: 'Часы', img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format&fit=crop&q=80' },
      { name: 'Кроссовки', img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&auto=format&fit=crop&q=80' },
      { name: 'Худи', img: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&auto=format&fit=crop&q=80' },
      { name: 'Рюкзак', img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&auto=format&fit=crop&q=80' },
      { name: 'Дрон', img: 'https://images.unsplash.com/photo-1508614589041-895b88991e3e?w=400&auto=format&fit=crop&q=80' },
      { name: 'Самокат', img: 'https://images.unsplash.com/photo-1597047084897-51e81819a499?w=400&auto=format&fit=crop&q=80' },
      { name: 'VR-Очки', img: 'https://images.unsplash.com/photo-1622979135225-d2ba269bc1bd?w=400&auto=format&fit=crop&q=80' },
      { name: 'Геймпад', img: 'https://images.unsplash.com/photo-1600080972464-8e5f35f63d08?w=400&auto=format&fit=crop&q=80' },
      { name: 'Клавиатура', img: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=400&auto=format&fit=crop&q=80' },
      { name: 'Консоль', img: 'https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=400&auto=format&fit=crop&q=80' },
      { name: 'Колонка', img: 'https://images.unsplash.com/photo-1545454675-3531b543be5d?w=400&auto=format&fit=crop&q=80' },
      { name: 'Камера', img: 'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=400&auto=format&fit=crop&q=80' },
      { name: 'Монитор', img: 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400&auto=format&fit=crop&q=80' }
    ];
    const PREFIXES = ['Ультра', 'Игровой', 'Беспроводной', 'Мини', 'Про', 'Смарт', 'Эко', 'Премиум', 'Ретро', 'Неоновый', 'Компактный', 'Автоматический', 'Спортивный', 'Тактический', 'Гибридный', 'Магнитный'];
    const SUFFIXES = ['Cyber', 'Vortex', 'Pro X', 'Lite', 'Max 5G', 'Edition', 'Force', 'Titan', 'Apex', 'Phantom', 'Shadow', 'Boost', 'Evo', 'Prime', 'Matrix', 'UltraSoft'];

    const PRODUCTS = [];
    let pCount = 1;
    for (let pref of PREFIXES) {
      for (let cat of CATEGORIES) {
        if (PRODUCTS.length >= 320) break;
        PRODUCTS.push({
          id: pCount,
          name: `${pref} ${cat.name} ${SUFFIXES[pCount % SUFFIXES.length]}`,
          price: Math.floor((pCount * 19) % 480) + 15,
          category: cat.name,
          image: cat.img
        });
        pCount++;
      }
    }

    // State
    let balance = Number(localStorage.getItem('pm_balance')) || 0;
    let cart = JSON.parse(localStorage.getItem('pm_cart')) || [];
    let orders = JSON.parse(localStorage.getItem('pm_orders')) || [];
    let currentRoom = localStorage.getItem('pm_room') || 'market71';
    let mqttClient = null;

    document.getElementById('room-input').value = currentRoom;

    function init() {
      setupMQTT();
      updateUI();
      renderCatalog();
      renderCart();
      renderOrders();
    }

    // Облачная синхронизация через публичный MQTT брокер
    function setupMQTT() {
      const statusDot = document.getElementById('sync-status');
      statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";

      if (mqttClient) mqttClient.end();

      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      mqttClient.on('connect', () => {
        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        mqttClient.subscribe(`playmarket/${currentRoom}/status_update`);
      });

      mqttClient.on('message', (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());
          if (data.orderId && data.status) {
            const ord = orders.find(o => o.id === data.orderId);
            if (ord && ord.status !== data.status) {
              ord.status = data.status;
              localStorage.setItem('pm_orders', JSON.stringify(orders));
              renderOrders();
              showToast(`🔔 Статус заказа ${data.orderId} изменён на "${data.status}"`, 'info');
            }
          }
        } catch (e) {}
      });

      mqttClient.on('error', () => { statusDot.className = "w-2 h-2 rounded-full bg-red-500"; });
    }

    function changeRoom() {
      currentRoom = document.getElementById('room-input').value.trim() || 'market71';
      localStorage.setItem('pm_room', currentRoom);
      setupMQTT();
      showToast(`🌐 Переключено на комнату: ${currentRoom}`, 'info');
    }

    function publishOrderToCloud(newOrder) {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`playmarket/${currentRoom}/new_order`, JSON.stringify(newOrder));
      }
    }

    function publishCancelToCloud(orderId) {
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`playmarket/${currentRoom}/status_update`, JSON.stringify({ orderId: orderId, status: 'Отменен' }));
      }
    }

    function updateUI() {
      document.getElementById('balance').innerText = balance;
      document.getElementById('cart-badge').innerText = cart.length;
      document.getElementById('orders-badge').innerText = orders.length;
      localStorage.setItem('pm_balance', balance);
      localStorage.setItem('pm_cart', JSON.stringify(cart));
      localStorage.setItem('pm_orders', JSON.stringify(orders));
    }

    function switchTab(tab) {
      ['catalog', 'cart', 'orders'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = "flex-1 py-3 px-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition text-slate-400 hover:text-white";
      });

      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      activeBtn.className = "flex-1 py-3 px-2 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 transition bg-amber-400 text-slate-950 shadow-md shadow-amber-400/20";
    }

    function topUp() {
      const input = document.getElementById('topup-input');
      const val = Number(input.value);
      if (val > 0) {
        balance += val;
        input.value = '';
        updateUI();
        showToast(`🎉 Баланс пополнен на +${val} $!`, 'success');
      } else {
        showToast('⚠️ Введите правильную сумму!', 'error');
      }
    }

    function renderCatalog() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('catalog-grid');
      const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(query));

      grid.innerHTML = filtered.slice(0, 50).map(p => `
        <div class="bg-slate-900 rounded-2xl border border-slate-800/80 overflow-hidden flex flex-col justify-between hover:border-amber-400/50 transition group shadow-lg">
          <div class="relative w-full h-28 sm:h-36 bg-slate-950 overflow-hidden">
            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
            <span class="absolute top-2 left-2 text-[8px] font-black uppercase bg-slate-950/80 text-amber-400 px-1.5 py-0.5 rounded-md border border-slate-700/50">
              ${p.category}
            </span>
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between space-y-2">
            <h3 class="font-bold text-[11px] sm:text-xs text-slate-200 line-clamp-2 leading-tight">${p.name}</h3>
            <div class="flex justify-between items-center pt-1.5 border-t border-slate-800/60">
              <span class="font-black text-emerald-400 text-xs sm:text-sm">${p.price} $</span>
              <button onclick="addToCart(${p.id})" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-950 font-black px-2 py-1 rounded-lg text-[10px] sm:text-[11px] shadow-sm shadow-amber-400/20 transition">
                + В корзину
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const prod = PRODUCTS.find(p => p.id === id);
      cart.push(prod);
      updateUI();
      renderCart();
      showToast(`🛒 "${prod.name}" добавлен в корзину!`, 'success');
    }

    function removeFromCart(index) {
      const removed = cart.splice(index, 1)[0];
      updateUI();
      renderCart();
      showToast(`🗑️ "${removed.name}" удалён из корзины.`, 'info');
    }

    function renderCart() {
      const container = document.getElementById('cart-items-list');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center py-10 text-sm font-medium">Ваша корзина пока пуста 🛒</p>';
      } else {
        container.innerHTML = cart.map((item, idx) => {
          total += item.price;
          return `
            <div class="flex items-center gap-3 bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
              <img src="${item.image}" class="w-12 h-12 rounded-xl object-cover">
              <div class="flex-1 min-w-0">
                <p class="text-xs font-bold text-slate-200 truncate">${item.name}</p>
                <p class="text-xs font-black text-emerald-400">${item.price} $</p>
              </div>
              <button onclick="removeFromCart(${idx})" class="text-red-400 hover:text-red-300 font-bold text-sm px-2">✕</button>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cart-total-price').innerText = `${total} $`;
    }

    function checkout() {
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      if (cart.length === 0) return showToast('⚠️ Корзина пуста!', 'error');
      if (balance < total) return showToast(`⚠️ Недостаточно денег! Баланс: ${balance} $, нужно: ${total} $`, 'error');

      balance -= total;
      const code5Digit = Math.floor(10000 + Math.random() * 90000).toString();

      const newOrder = {
        id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
        code: code5Digit,
        items: [...cart],
        total: total,
        status: 'В пути',
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      orders.unshift(newOrder);
      cart = [];
      updateUI();
      renderCart();
      renderOrders();

      publishOrderToCloud(newOrder);

      switchTab('orders');
      showToast(`🎉 Заказ ${newOrder.id} создан! Код: ${newOrder.code}`, 'success');
    }

    function cancelOrder(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order && order.status === 'В пути') {
        order.status = 'Отменен';
        balance += order.total;
        updateUI();
        renderOrders();
        publishCancelToCloud(orderId);
        showToast(`❌ Заказ ${orderId} отменён. +${order.total} $ возвращено!`, 'info');
      }
    }

    function renderOrders() {
      const container = document.getElementById('buyer-orders-list');
      if (orders.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">У вас пока нет оформленных заказов.</p>';
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-lg">
          <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800/80 pb-2">
            <div class="flex items-center gap-2">
              <span class="font-black text-amber-400 text-base">${o.id}</span>
              <span class="text-slate-500 text-xs">${o.date}</span>
            </div>
            <span class="px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider ${getStatusBadgeClass(o.status)}">
              ${o.status}
            </span>
          </div>

          <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="space-y-1.5 w-full md:w-auto">
              <p class="text-xs text-slate-400 font-medium">
                Состав: <span class="text-slate-200 font-semibold">${o.items.map(i => i.name).join(', ')}</span>
              </p>
              <p class="text-xs text-slate-400">Сумма: <b class="text-emerald-400 font-black text-sm">${o.total} $</b></p>
              
              <!-- 🔑 5-значный код -->
              <div class="inline-flex items-center gap-2 bg-amber-400/10 border border-amber-400/30 px-3 py-1.5 rounded-xl">
                <span class="text-[11px] text-slate-400 font-bold">🔑 Код для продавца:</span>
                <span class="font-black text-amber-400 text-lg tracking-widest">${o.code}</span>
              </div>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end pt-2 md:pt-0 border-t md:border-0 border-slate-800">
              <div class="text-center">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${o.code}" alt="QR" class="w-16 h-16 rounded-xl bg-white p-1 shadow-md">
                <p class="text-[9px] text-slate-500 mt-1 font-bold">QR код</p>
              </div>

              ${o.status === 'В пути' ? `
                <button onclick="cancelOrder('${o.id}')" class="bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 active:scale-95 text-xs font-bold px-4 py-3 rounded-xl transition">
                  Отменить заказ
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function getStatusBadgeClass(status) {
      switch (status) {
        case 'В пути': return 'bg-blue-500/20 border border-blue-500/30 text-blue-400';
        case 'Прибыл': return 'bg-emerald-500/20 border border-emerald-500/30 text-emerald-400';
        case 'Поврежден': return 'bg-amber-500/20 border border-amber-500/30 text-amber-400';
        case 'Отменен': return 'bg-red-500/20 border border-red-500/30 text-red-400';
        default: return 'bg-slate-800 text-slate-400';
      }
    }

    // Красивые тосты вместо alert
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const body = document.getElementById('toast-body');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');

      msgEl.innerText = msg;
      iconEl.innerText = type === 'success' ? '🎉' : type === 'error' ? '⚠️' : '🔔';

      container.classList.remove('toast-enter');
      container.classList.add('toast-show');

      setTimeout(() => {
        container.classList.remove('toast-show');
        container.classList.add('toast-enter');
      }, 3000);
    }

    init();
  </script>
</body>
</html>
